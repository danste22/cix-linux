name: Watch OBS linux-cix

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: read the public build status
        run: python3 scripts/watch_obs_status.py --json-output obs-status.json

      - name: open or close the status issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          status = json.loads(open("obs-status.json", encoding="utf-8").read())
          title = "OBS linux-cix is not succeeding"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          issues = request(
              "GET",
              f"https://api.github.com/repos/{repository}/issues?state=open&per_page=100",
          )
          existing = next(
              (
                  item
                  for item in issues
                  if item["title"] == title and "pull_request" not in item
              ),
              None,
          )
          code = status["code"]
          if code == "succeeded":
              if existing is not None:
                  request(
                      "PATCH",
                      f"https://api.github.com/repos/{repository}/issues/{existing['number']}",
                      {"state": "closed"},
                  )
              raise SystemExit(0)
          if code not in {"failed", "unresolvable"}:
              raise SystemExit(0)
          body = (
              "linux-cix on home:danste22:o6n-debian-13 backports aarch64 "
              f"is {code}.\n\n{status['details']}\n\n"
              "https://build.opensuse.org/package/show/"
              "home:danste22:o6n-debian-13/linux-cix"
          )
          if existing is None:
              request(
                  "POST",
                  f"https://api.github.com/repos/{repository}/issues",
                  {"title": title, "body": body},
              )
          elif existing.get("body") != body:
              request(
                  "PATCH",
                  f"https://api.github.com/repos/{repository}/issues/{existing['number']}",
                  {"body": body},
              )
          PY
